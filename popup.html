<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Extension</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="top">
      <img class="logo" data-state-icon src="icon48.png" alt="">
      <div class="top-title">
        <h1>YT Extension</h1>
        <span class="version" id="version-tag">v5.2.0</span>
      </div>
      <button class="icon-button" id="btn-open-settings" type="button" aria-label="Abrir Control Center" title="Abrir Control Center">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.47.47 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </header>

    <section class="power" aria-labelledby="extension-status-title">
      <div>
        <h2 id="extension-status-title">Extensão ativa</h2>
        <p class="power-line"><span class="status-pip active"></span><span id="status-text">Monitorando o YouTube</span></p>
      </div>
      <label class="switch switch--big" aria-label="Ativar extensão">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="switch-track"></span>
      </label>
    </section>

    <dl class="stats">
      <div><dt>pulados</dt><dd id="metric-total">0</dd></div>
      <div><dt>hoje</dt><dd id="metric-today">0</dd></div>
      <div><dt>avisos</dt><dd id="metric-warnings">0</dd></div>
    </dl>

    <section class="group" aria-labelledby="skipper-title">
      <h3 id="skipper-title">Anúncios</h3>
      <label class="row">
        <span class="row-text"><strong>Pular anúncios</strong></span>
        <span class="switch"><input type="checkbox" id="toggle-ad-skipper" checked><span class="switch-track"></span></span>
      </label>
      <label class="row">
        <span class="row-text"><strong>Modo acelerado</strong><small id="mode-description">Botão nativo primeiro, aceleração como fallback</small></span>
        <span class="switch"><input type="checkbox" id="toggle-aggressive" checked><span class="switch-track"></span></span>
      </label>
      <div class="row row--stack" id="block-delay">
        <div class="row-head">
          <label for="skip-delay"><strong>Tempo para pular</strong></label>
          <output id="delay-display" for="skip-delay">1s</output>
        </div>
        <input type="range" id="skip-delay" min="1" max="30" value="1" step="1" aria-label="Tempo para pular o anúncio">
        <div class="range-caption"><span id="delay-hint">Rápido</span><span>30s</span></div>
      </div>
      <div class="chips">
        <label class="chip" title="Silenciar anúncios"><input type="checkbox" id="toggle-mute" checked><span>Silenciar</span></label>
        <label class="chip" title="Mostrar a contagem no player"><input type="checkbox" id="toggle-overlay" checked><span>Contagem</span></label>
        <label class="chip" title="Pular pesquisas automaticamente"><input type="checkbox" data-popup-setting="skipSurveysEnabled"><span>Pesquisas</span></label>
      </div>
    </section>

    <section class="group" aria-labelledby="player-quick-title">
      <h3 id="player-quick-title">Player</h3>
      <div class="row">
        <span class="row-text"><strong>Botões</strong></span>
        <div class="segmented" role="radiogroup" aria-label="Onde ficam os botões">
          <button type="button" role="radio" data-placement="inside">Dentro</button>
          <button type="button" role="radio" data-placement="below">Fora</button>
          <button type="button" role="radio" data-placement="off">Off</button>
        </div>
      </div>
      <div class="row" id="style-row">
        <span class="row-text"><strong>Visual</strong><small>dos botões dentro do player</small></span>
        <div class="segmented" role="radiogroup" aria-label="Visual dos botões">
          <button type="button" role="radio" data-controls-style="pill">Caixa</button>
          <button type="button" role="radio" data-controls-style="divider">Junto</button>
        </div>
      </div>
      <label class="row">
        <span class="row-text"><strong>Miniplayer</strong><small>ao descer para os comentários</small></span>
        <span class="switch"><input type="checkbox" data-popup-setting="miniplayerEnabled"><span class="switch-track"></span></span>
      </label>
      <label class="row">
        <span class="row-text"><strong>Tirar atraso das lives</strong></span>
        <span class="switch"><input type="checkbox" data-popup-setting="liveCatchUpEnabled"><span class="switch-track"></span></span>
      </label>
    </section>

    <p class="change-note" id="change-note" role="status" aria-live="polite"></p>

    <footer class="foot">
      <button class="primary" id="btn-open-settings-main" type="button">Control Center</button>
      <span id="warning-text">Nenhum aviso interceptado.</span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
