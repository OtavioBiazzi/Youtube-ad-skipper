name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  extension:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Verify extension
        run: node scripts/verify-extension.mjs

      - name: Package extension
        run: node scripts/package-extension.mjs

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-extension-package
          path: release/*.zip
